function nav(i){return `<nav class="page-nav" aria-label="ניווט בין עמודים"><button type="button" onclick="flipTo(${i-1})">→ הקודם</button><button type="button" onclick="flipTo(1)">תוכן העניינים</button><button type="button" class="primary" onclick="flipTo(${i+1})">הבא ←</button></nav>`}
function buildBook(){bookEl.innerHTML=`<section class="sheet"><div class="page-inner cover">${header('Sodexo × ניצנה')}<div class="cover-copy"><span class="eyebrow">עם שף יפתח חג׳בי</span><h1 tabindex="-1">חוברת מתכונים<br>לסדנת סושי</h1><p class="sub">הבסיס לאורז מושלם, רטבים ותוספות אסייתיות — צעד אחר צעד.</p><button type="button" onclick="flipTo(1)">פותחים ומתחילים ←</button></div></div></section><section class="sheet"><div class="page-inner">${header('ספר המתכונים')}<h2 tabindex="-1">תוכן העניינים</h2><p class="sub">בוחרים מתכון, מסמנים מצרכים ומבשלים בקצב שלכם.</p><div class="toc-list">${RECIPES.map((r,i)=>`<button type="button" class="toc-card" onclick="flipTo(${i+2})"><img src="${ASSETS+r.image}" alt="" width="76" height="76"><span class="copy"><strong>${esc(r.title)}</strong><small>${esc(r.sub)}</small></span><span class="pill"><bdi>${r.num}</bdi></span></button>`).join('')}</div>${nav(1)}</div></section>`+RECIPES.map((r,i)=>`<section class="sheet" data-recipe="${i}"><div class="page-inner">${header('מתכון '+(i+1)+' מתוך '+RECIPES.length)}<div class="recipe-top"><div><h2 tabindex="-1">${esc(r.title)}</h2><p class="sub">${esc(r.sub)}</p></div><div><div class="quantity-note">הכפלת הכמויות המקוריות</div><div class="scale-box" role="group" aria-label="הכפלת כמויות">${[.5,1,2].map(x=>`<button type="button" class="${scales[i]===x?'active':''}" aria-pressed="${scales[i]===x}" onclick="setScale(${i},${x})">×${x}</button>`).join('')}</div></div></div>${i===2?`<div class="home-scale"><label for="batch">גודל הכנה לחמוצים: </label><select id="batch" onchange="setScale(2,Number(this.value))"><option value="0.04" ${scales[i]===.04?'selected':''}>ביתי — 1 ק״ג ירקות (1/25 מהמקור)</option><option value="0.5" ${scales[i]===.5?'selected':''}>חצי מתכון — 12.5 ק״ג ירקות</option><option value="1" ${scales[i]===1?'selected':''}>מתכון מקורי — 25 ק״ג ירקות</option><option value="2" ${scales[i]===2?'selected':''}>כפול — 50 ק״ג ירקות</option></select></div>`:''}<div class="recipe-grid"><div><img class="recipe-image" src="${ASSETS+r.image}" alt="${esc(r.title)}" width="480" height="210"><div class="book-block"><h3>מצרכים</h3>${r.ings.map((ing,j)=>check(`ing-${i}-${j}`,esc(ing.name),`<strong><bdi>${esc(formatAmount(ing,i))}</bdi></strong>`)).join('')}</div></div><div><div class="book-block"><h3>אופן ההכנה</h3><ol class="steps">${r.steps.map((s,j)=>`<li>${check(`step-${i}-${j}`,`<span class="step-num">${j+1}.</span> ${esc(s)}`)}</li>`).join('')}</ol></div><aside class="tip"><strong>טיפ מהשף</strong><br>${esc(r.tip)}</aside>${i===0?`<div class="timer"><span>טיימר:</span><button type="button" onclick="startTimer(12,'בישול אורז')">12 דקות · בישול</button><button type="button" onclick="startTimer(10,'מנוחת אורז')">10 דקות · מנוחה</button></div><p class="quantity-note">זמן הבישול במתכון: 12–14 דקות. הטיימר מתחיל ב־12 דקות.</p>`:i===4?`<div class="timer"><button type="button" onclick="startTimer(15,'המתנה לפני הגשה')">טיימר · 15 דקות</button></div>`:''}<button type="button" onclick="resetChecks(${i})">איפוס הסימונים במתכון</button></div></div>${nav(i+2)}</div></section>`).join('')+`<section class="sheet"><div class="page-inner back">${header('סוף הספרון')}<h2 tabindex="-1">בתיאבון ובהצלחה בסדנה!</h2><p>מתכוני בסיס, רטבים ותוספות אסייתיות</p><p>בהנחיית שף יפתח חג׳בי</p><p>Sodexo × ניצנה</p><p>קהילה חינוכית־התיישבותית על שם אריה לובה אליאב</p><nav class="page-nav"><button type="button" onclick="flipTo(${TOTAL_SHEETS-2})">→ למתכון האחרון</button><button type="button" onclick="flipTo(0)">חזרה לכריכה ↻</button></nav></div></section>`;updateBook(false)}
function check(key,label,extra=''){return `<label class="check"><input type="checkbox" data-key="${key}" ${checkedMap[key]?'checked':''} onchange="toggleCheck(this)"><span class="text">${label}</span>${extra}</label>`}
function updateBook(focus=true){document.querySelectorAll('.sheet').forEach((s,i)=>{s.classList.toggle('active',i===currentPage);s.inert=i!==currentPage;s.setAttribute('aria-hidden',String(i!==currentPage))});document.getElementById('progress').textContent=currentPage===0?'5 מתכונים · סדנת סושי':currentPage===1?'תוכן העניינים':currentPage===TOTAL_SHEETS-1?'סוף הספרון':`מתכון ${currentPage-1} מתוך 5`;if(focus){window.scrollTo({top:0,behavior:'instant'});document.querySelector('.sheet.active h1,.sheet.active h2')?.focus({preventScroll:true})}}
function flipTo(n){currentPage=Math.min(TOTAL_SHEETS-1,Math.max(0,n));updateBook()}
function setScale(i,n){scales[i]=n;save();const y=window.scrollY;buildBook();window.scrollTo(0,y)}
function toggleCheck(input){checkedMap[input.dataset.key]=input.checked;save()}
function resetChecks(i){Object.keys(checkedMap).filter(k=>k.startsWith('ing-'+i+'-')||k.startsWith('step-'+i+'-')).forEach(k=>delete checkedMap[k]);save();buildBook()}
async function requestWake(){if(!cooking||document.visibilityState!=='visible')return;const note=document.getElementById('wakeNote');note.hidden=false;try{if(!('wakeLock' in navigator))throw Error();wakeLock=await navigator.wakeLock.request('screen');note.textContent='מצב בישול פעיל · המסך נשאר דולק כל עוד העמוד גלוי.';wakeLock.addEventListener('release',()=>{if(cooking)note.textContent='שמירת המסך הדולק הופסקה. ניתן להפעיל שוב את מצב הבישול.'})}catch{note.textContent='מצב בישול פעיל · שמירת מסך דולק אינה זמינה כרגע בדפדפן זה.'}}
async function toggleCook(){cooking=!cooking;document.body.classList.toggle('cook',cooking);document.getElementById('cookBtn').setAttribute('aria-pressed',String(cooking));if(cooking)await requestWake();else{document.getElementById('wakeNote').hidden=true;await wakeLock?.release();wakeLock=null}}
document.addEventListener('visibilitychange',()=>{if(cooking&&document.visibilityState==='visible')requestWake()});
function startTimer(minutes,name){clearInterval(timerId);const end=Date.now()+minutes*60000;document.getElementById('timerPanel').hidden=false;document.getElementById('timerName').textContent=name;document.getElementById('timerAlert').textContent='';function tick(){const seconds=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById('timerOutput').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds===0){clearInterval(timerId);document.getElementById('timerAlert').textContent='הזמן הסתיים!';}}tick();timerId=setInterval(tick,500)}
function stopTimer(){clearInterval(timerId);document.getElementById('timerPanel').hidden=true}
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,button,textarea')||e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='ArrowLeft'){e.preventDefault();flipTo(currentPage+1)}if(e.key==='ArrowRight'){e.preventDefault();flipTo(currentPage-1)}});
let touch=null;bookEl.addEventListener('touchstart',e=>{if(e.target.closest('button,input,select,label')){touch=null;return}touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});bookEl.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2)flipTo(currentPage+(dx>0?1:-1))},{passive:true});
window.addEventListener('beforeprint',()=>document.querySelectorAll('.sheet').forEach(s=>{s.inert=false;s.removeAttribute('aria-hidden')}));window.addEventListener('afterprint',()=>updateBook(false));buildBook();
</script></body></html>
